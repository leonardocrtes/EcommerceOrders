version: '3.8'

services:
  # Serviço 1: Banco de Dados SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_Strong_Password123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  # Serviço 2: Web API .NET 8
  api:
    build:
      context: .
      dockerfile: src/EcommerceOrders.Api/Dockerfile
    container_name: ecommerce-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=EcommerceOrdersDb;User Id=sa;Password=Your_Strong_Password123!;TrustServerCertificate=True;
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver

volumes:
  sqlserver_data: